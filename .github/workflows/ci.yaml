name: CI - Build & Push Order Service

on:
  push:
    branches:
      - main
    paths:
      - "apps/order-service/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: order-service
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Docker image (SAFE CONTEXT)
      - name: Build Docker image
        run: docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} ./apps/order-service

      # 5️⃣ Verify image exists (CRITICAL DEBUG GUARD)
      - name: Verify Docker image exists
        run: |
          echo "=== Docker Images ==="
          docker images
          echo "=== Inspect Image ==="
          docker inspect ${ECR_REPOSITORY}:${IMAGE_TAG}

      # 6️⃣ Trivy scan (NON-BLOCKING FOR NOW)
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: order-service:latest
          severity: CRITICAL,HIGH
          exit-code: 0

      # 7️⃣ Debug environment variables
      - name: Debug env vars
        run: |
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
          echo "AWS_REGION=${AWS_REGION}"
          echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

      # 8️⃣ Tag image for ECR
      - name: Tag Docker image
        run: docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

      # 9️⃣ Push image to ECR
      - name: Push image to Amazon ECR
        run: docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

